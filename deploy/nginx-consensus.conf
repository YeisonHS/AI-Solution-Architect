# Sustituye example.com y las rutas TLS antes de habilitar este bloque.
# Coloca este archivo como configuración de sitio Nginx; el puerto 8080 debe quedar privado.
server {
    listen 80;
    server_name example.com;

    # Tras configurar Certbot o tu gestor TLS, redirige este bloque a HTTPS.
    # return 301 https://$host$request_uri;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
