[metadata]
name = consensus-engine
version = 0.1.0
description = Deterministic consensus policy for architecture-review verdicts.

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = False

[options.packages.find]
where = src

[options.package_data]
consensus_web =
    static/*.html
    static/*.css
    static/*.js

[options.entry_points]
console_scripts =
    consensus-engine = consensus_web.server:main
